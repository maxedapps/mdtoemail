[markdown]
gfm = true
frontmatter = true
# Reserved for future unsafe/raw HTML handling. Email-safe output currently escapes raw HTML either way.
raw_html = false

[email]
container_width = 600
outer_padding = "24px 12px"
warnings = true
strict = false

[theme]
# Optional reusable theme selected from ./themes/<name>.toml, unless --theme overrides it.
# extends = "newsletter"
background_color = "#f4f4f4"
container_background = "#ffffff"
text_color = "#222222"
heading_color = "#222222"
muted_text_color = "#666666"
link_color = "#2563eb"
border_color = "#dddddd"
table_header_background = "#f3f4f6"
code_background = "#f3f4f6"
blockquote_border_color = "#dddddd"
font_family = "Arial, Helvetica, sans-serif"
code_font_family = "Consolas, Monaco, monospace"
base_font_size = "16px"
small_font_size = "14px"
# Keep line_height quoted; config values used in CSS are strings for now.
line_height = "1.5"
content_padding = "32px"
h1_font_size = "28px"
h2_font_size = "24px"
h3_font_size = "20px"
minor_heading_font_size = "16px"
h1_line_height = "1.25"
h2_line_height = "1.3"
h3_line_height = "1.35"
minor_heading_line_height = "1.5"
h1_margin = "0 0 20px 0"
h2_margin = "24px 0 16px 0"
h3_margin = "20px 0 12px 0"
minor_heading_margin = "16px 0 8px 0"
paragraph_margin = "0 0 16px 0"
list_margin = "0 0 16px 0"
list_padding = "0 0 0 24px"
list_item_margin = "0 0 8px 0"
blockquote_margin = "0 0 16px 0"
blockquote_padding = "0 0 0 16px"
code_font_size = "90%"
code_padding = "2px 4px"
pre_margin = "0 0 16px 0"
pre_padding = "12px"
pre_font_size = "14px"
pre_line_height = "1.4"
hr_margin = "24px 0"
image_margin = "0 0 16px 0"
table_margin = "0 0 16px 0"
table_cell_padding = "8px"
footnote_margin = "24px 0 0 0"
footnote_padding = "16px 0 0 0"
